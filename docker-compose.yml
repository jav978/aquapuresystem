version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aquasystem-postgres
    environment:
      POSTGRES_DB: aquasystem
      POSTGRES_USER: aqua
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aquasystem}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqua -d aquasystem"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aquasystem-network

  redis:
    image: redis:7-alpine
    container_name: aquasystem-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - aquasystem-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: aquasystem-api
    ports:
      - "3030:3030"
    environment:
      DATABASE_URL: postgresql://aqua:${DB_PASSWORD:-aquasystem}@postgres:5432/aquasystem
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production-min-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT: 3030
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm run dev
    networks:
      - aquasystem-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: aquasystem-web
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_URL: http://localhost:3030
      NUXT_PUBLIC_WS_URL: ws://localhost:3030
      NODE_ENV: development
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.nuxt
      - /app/.output
    depends_on:
      - api
    command: pnpm run dev
    networks:
      - aquasystem-network

volumes:
  postgres_data:
  redis_data:

networks:
  aquasystem-network:
    driver: bridge