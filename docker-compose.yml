version: '3.8'

services:
  # =========================================================================
  # Web App Frontend & API Service (AquaPure Pro)
  # =========================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aquapure-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aquapure_admin}:${POSTGRES_PASSWORD:-AquaPureSecure2026!}@db:5432/${POSTGRES_DB:-aquapuredb}?schema=public
      - APP_SECRET_KEY=${APP_SECRET_KEY:-aquapure_cryptographic_secret_key_2026}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aquapure-internal-net

  # =========================================================================
  # Protected PostgreSQL Database (Isolated in Private Docker Network)
  # =========================================================================
  db:
    image: postgres:16-alpine
    container_name: aquapure-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquapuredb}
      POSTGRES_USER: ${POSTGRES_USER:-aquapure_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AquaPureSecure2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Isolated Docker Named Volume (Inaccessible from Windows/Linux file explorer)
      - aquapure_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquapure_admin} -d ${POSTGRES_DB:-aquapuredb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aquapure-internal-net

# =========================================================================
# Volumes & Networks (Hardened Security Isolation)
# =========================================================================
volumes:
  aquapure_pg_data:
    driver: local

networks:
  aquapure-internal-net:
    driver: bridge